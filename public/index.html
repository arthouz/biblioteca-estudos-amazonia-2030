<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca de Estudos · Amazônia 2030</title>
  <meta name="description" content="Biblioteca digital dos estudos do Amazônia 2030: ficha documental, resumo e acesso ao PDF original de cada publicação." />
  <meta name="theme-color" content="#f7f5ef" />
  <link rel="icon" href="brand/favicon.png" type="image/png" />
  <link rel="stylesheet" href="%CSS%" />
  <script>try{var t=localStorage.getItem("a2030-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Esta biblioteca precisa de JavaScript para funcionar. Os PDFs dos estudos estão na pasta <code>pdfs/</code>.</p></noscript>
  <script type="module" src="%JS%"></script>
</body>
</html>
